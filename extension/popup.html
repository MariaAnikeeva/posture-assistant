<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ассистент осанки</title>
<style>:root{font-family:Arial,sans-serif;color:#243a33;background:#f6f5ee}body{width:280px;margin:0;padding:16px;box-sizing:border-box}h1{font-size:16px;margin:0 0 8px}p{font-size:12px;line-height:1.5;color:#637168;min-height:36px}.actions{display:flex;gap:8px}button{flex:1;border:1px solid #d9e0d9;border-radius:9px;padding:10px;background:#fff;color:#243a33;font-weight:700;cursor:pointer}button.primary{background:#386f68;color:#fff;border-color:#386f68}button:disabled{opacity:.45;cursor:not-allowed}#status{font-weight:700;color:#386f68;min-height:16px}</style>
</head><body><h1>Ассистент осанки</h1><p id="status">Проверяем состояние…</p>
